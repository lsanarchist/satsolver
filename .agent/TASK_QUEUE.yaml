schema_version: 1
selection_policy:
  continue_in_progress_first: true
  pick_status: todo
  dependencies_must_be_done: true
  tie_breaker:
    - priority_desc
    - phase_asc
    - id_asc
statuses:
  - todo
  - in_progress
  - blocked
  - done
  - dropped
tasks:
  - id: cp-001
    phase: 0
    priority: 100
    status: done
    title: Bootstrap the repo-local autonomous queue control plane
    size: M
    depends_on: []
    goal: Create a deterministic repo-native control plane rooted in AGENT.md and .agent/* so repeated prompts can advance from repo state instead of human task management.
    deliverables:
      - AGENT.md
      - .agent/README.md
      - .agent/RUNBOOK.md
      - .agent/STATE.yaml
      - .agent/TASK_QUEUE.yaml
      - .agent/HANDOFF.md
      - .agent/DECISIONS.md
      - .agent/WORKLOG.md
      - .agent/TEST_GATES.md
      - QUEUE_PROMPT.md
    verify:
      - python tools/codex_verify.py
  - id: cp-002
    phase: 0
    priority: 95
    status: done
    title: Sync legacy workflow docs and agent instructions to the queue control plane
    size: S
    depends_on:
      - cp-001
    goal: Align the existing repo docs and Codex-facing instructions with AGENT.md and .agent/* so future runs do not see competing operating models.
    deliverables:
      - AGENTS.md
      - README.md
      - docs/codex/operator-guide.md
      - docs/codex/queued-task-template.md
      - PLANS.md
    verify:
      - python tools/codex_verify.py
  - id: cp-003
    phase: 0
    priority: 90
    status: done
    title: Add a control-plane consistency checker and tests
    size: M
    depends_on:
      - cp-001
      - cp-002
    goal: Add a small standard-library validator that checks TASK_QUEUE selection invariants and STATE/TASK_QUEUE cross-consistency so autonomous runs can fail fast on stale queue state.
    deliverables:
      - tools/agent_queue_check.py
      - tests/test_agent_queue_check.py
      - any small doc updates needed to explain how to run the checker
    verify:
      - python -m unittest discover -s tests -q
      - python tools/codex_verify.py
  - id: sat-001
    phase: 1
    priority: 80
    status: done
    title: Deduplicate shared DIMACS parsing and result-writing helpers
    size: M
    depends_on: []
    goal: Move duplicate parsing and output-format code shared by satsolver.py and satsolver_fast.py into one standard-library helper module without changing solver behavior.
    deliverables:
      - shared helper module for DIMACS parsing and result writing
      - updated submission and comparison wrappers
      - regression tests covering the shared helper path
    verify:
      - python tools/codex_verify.py
  - id: tool-001
    phase: 2
    priority: 70
    status: done
    title: Expand codex verification coverage for alternate wrappers
    size: M
    depends_on:
      - sat-001
    goal: Extend the verification helper or tests so shared wrapper behavior stays covered after helper deduplication and future wrapper changes.
    deliverables:
      - updated tools/codex_verify.py or targeted tests
      - regression coverage for wrapper smoke behavior
    verify:
      - python -m unittest discover -s tests -q
      - python tools/codex_verify.py
  - id: perf-001
    phase: 2
    priority: 60
    status: done
    title: Revalidate portfolio gating thresholds with same-day benchmark evidence
    size: L
    depends_on:
      - sat-001
    goal: Recheck the shared portfolio gating constants against representative hotspot and exact-CLI benchmarks, keeping or updating them only with clear same-day evidence.
    deliverables:
      - code or retained-noop conclusion with rationale
      - PLANS.md verification notes
      - benchmark_summary.md and experiments.jsonl updates only if a result is kept
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf medium/test_4.cnf large/test_10.cnf large/test_8.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-002
    phase: 2
    priority: 95
    status: done
    title: Seed a rolling native-only SAT optimization program
    size: S
    depends_on: []
    goal: Reopen the queue with a long-running but bounded optimization program that keeps the retained solver standard-library only while allowing external references for short-lived research.
    deliverables:
      - updated native-only optimization guidance in AGENT.md and AGENTS.md
      - reopened performance queue with small benchmark-driven tasks
      - refreshed control-plane state and handoff
    verify:
      - python tools/agent_queue_check.py
      - python tools/codex_verify.py
  - id: perf-003
    phase: 2
    priority: 94
    status: done
    title: Refresh the native-only exact-CLI baseline and hotspot slice
    size: M
    depends_on:
      - perf-002
    goal: Rebuild a same-day exact-CLI baseline for the retained standard-library solver, identify the hottest representative benchmarks, and record the next native-only optimization targets from fresh evidence.
    deliverables:
      - refreshed hotspot slice with rationale in PLANS.md
      - exact-CLI baseline timings for the retained solver
      - follow-on optimization recommendations grounded in same-day data
    verify:
      - python tools/codex_verify.py
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-004
    phase: 2
    priority: 90
    status: done
    title: Explore propagation and clause-storage micro-optimizations
    size: L
    depends_on:
      - perf-003
    goal: Test one bounded candidate that reduces propagation or clause-database overhead on the refreshed hotspot slice, keeping it only if same-day exact-CLI evidence wins cleanly.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - targeted regression coverage if behavior changes
      - PLANS.md experiment notes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-005
    phase: 2
    priority: 85
    status: done
    title: Explore branching and restart heuristic changes
    size: L
    depends_on:
      - perf-003
    goal: Test one bounded change to branching or restart policy against the refreshed hotspot slice, keeping it only if the same-day exact-CLI data justifies it.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - targeted regression coverage if behavior changes
      - PLANS.md experiment notes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-006
    phase: 2
    priority: 80
    status: done
    title: Measure and reduce native-only wrapper and startup overhead
    size: M
    depends_on:
      - perf-003
    goal: Identify avoidable CLI or wrapper overhead in the standard-library path and keep only wins that improve exact-CLI benchmark results without changing the required interface.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - updated smoke or regression coverage if the execution path changes
      - PLANS.md experiment notes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-007
    phase: 2
    priority: 70
    status: done
    title: Use external solver references to derive native-only gap targets
    size: M
    depends_on:
      - perf-003
    goal: Compare the retained solver against optional external-library or non-native solver references as short-lived research tools, then translate any meaningful gap into native-only follow-on work without retaining those dependencies.
    deliverables:
      - external-reference notes in PLANS.md
      - native-only follow-on task suggestions or retained-noop conclusion
      - no retained non-standard-library submission dependency
    verify:
      - python tools/codex_verify.py
      - any adapter-specific or external comparison command used for the research run
  - id: perf-008
    phase: 2
    priority: 68
    status: done
    title: Test a watch-family split on dense UNSAT hotspots
    size: L
    depends_on:
      - perf-007
    goal: Reduce mixed watched-list traversal on the dense UNSAT hotspot families by testing one true split between problem-ternary traffic and the learnt-heavy watch families, keeping it only if same-day exact-CLI evidence wins without weakening the SAT guardrail or structural fast-exit cases.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - PLANS.md notes tied to the refreshed dense-UNSAT profiler counters
      - targeted regression or profiler updates if the watch structure changes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py special/pigeonhole.cnf special/tseitin.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-009
    phase: 2
    priority: 64
    status: done
    title: Revisit dense-UNSAT conflict-analysis after the watch-family lane
    size: L
    depends_on:
      - perf-008
    goal: If the watch-family split still leaves a large dense-UNSAT gap, use the refreshed reason-traversal and minimization counters on `large/test_6.cnf` and `special/hard.cnf` to test one bounded conflict-analysis or learnt-minimization candidate without weakening the structural fast-exit cases.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - PLANS.md notes grounded in the dense-UNSAT reason counters
      - targeted regression coverage if solver behavior changes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py special/pigeonhole.cnf special/tseitin.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-010
    phase: 2
    priority: 62
    status: done
    title: Target same-search conflict-analysis bookkeeping after the minimization-selector reject
    size: L
    depends_on:
      - perf-009
    goal: Use the perf-009 reject to avoid further minimization-relaxation rules for now, and instead test one bounded conflict-analysis overhead reduction that preserves minimized clause contents while still targeting the dense UNSAT hotspot slice.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - PLANS.md notes tied to same-search conflict-analysis bookkeeping
      - targeted regression coverage if solver behavior changes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py special/pigeonhole.cnf special/tseitin.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-011
    phase: 2
    priority: 60
    status: done
    title: Probe learnt-finalization bookkeeping after the minimize-branch-order reject
    size: L
    depends_on:
      - perf-010
    goal: Use the perf-010 reject to avoid more reason-size branch-order tweaks for now, and instead test one bounded same-clause-content bookkeeping change in prepare_learnt_clause() or adjacent learnt finalization on the dense UNSAT hotspot slice.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - PLANS.md notes tied to learnt-finalization bookkeeping
      - targeted regression coverage if solver behavior changes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py special/pigeonhole.cnf special/tseitin.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-012
    phase: 2
    priority: 58
    status: done
    title: Probe post-minimization learnt-metadata bookkeeping after the loop-shape reject
    size: L
    depends_on:
      - perf-011
    goal: Use the perf-011 reject to avoid more pure loop-shape cleanup inside prepare_learnt_clause() for now, and instead test one bounded same-clause-content bookkeeping change at the analyze-to-finalization boundary or adjacent learnt-metadata path on the dense UNSAT hotspot slice.
    deliverables:
      - candidate code or retained-noop conclusion with rationale
      - PLANS.md notes tied to post-minimization learnt-metadata bookkeeping
      - targeted regression coverage if solver behavior changes
    verify:
      - python tools/codex_verify.py
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py large/test_6.cnf special/hard.cnf large/test_10.cnf medium/test_4.cnf medium/test_3.cnf satlib_more/uuf150-01.cnf large/test_8.cnf
      - python tools/hotspot_compare.py --baseline-cli-script <baseline>/satsolver.py --candidate-cli-script satsolver.py special/pigeonhole.cnf special/tseitin.cnf
      - python tools/codex_verify.py --benchmark-mode cli --repeat 2
  - id: perf-013
    phase: 2
    priority: 56
    status: done
    title: Refresh dense-UNSAT conflict-analysis profiling after the metadata-boundary keep
    size: M
    depends_on:
      - perf-012
    goal: Re-profile the retained solver after perf-012, confirm the new dominant conflict-analysis bookkeeping surfaces on `large/test_6.cnf` and `special/hard.cnf`, and record one evidence-backed next optimization target before attempting another solver-core experiment.
    deliverables:
      - refreshed `PLANS.md` profiling notes for the retained solver
      - updated next-task recommendation grounded in post-perf-012 profile evidence
      - no solver change required if this run is measurement-only
    verify:
      - python tools/profile_solver.py large/test_6.cnf special/hard.cnf
      - python -m cProfile -s tottime satsolver.py large/test_6.cnf /tmp/perf013_profile_large6.txt | head -n 45
      - python tools/codex_verify.py
  - id: perf-014
    phase: 2
    priority: 54
    status: done
    title: Probe original problem-ternary relocation or unit propagation after the profile refresh
    size: L
    depends_on:
      - perf-013
    goal: Use the refreshed post-perf-012 dense-UNSAT profile to test one bounded propagation change that reduces original problem-ternary relocation or unit-handling work on the seven-case hotspot slice without reviving rejected watcher-family-order, physical watch-split, or extra side-state lanes.
