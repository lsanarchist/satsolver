    size: M
    depends_on:
      - perf-021
    goal: Use the newly added supplemental satlib_more guard slice to measure which learnt-large outcomes and clause-shape buckets dominate those cases, so the next bounded learnt-large candidate is chosen from actual supplemental-case evidence rather than just the dense UNSAT anchors.
