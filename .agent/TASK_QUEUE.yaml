    phase: 2
    priority: 52
    status: done
    title: Refresh dense-UNSAT propagation profiling after the unit-first keep
    size: M
    depends_on:
      - perf-014
    goal: Re-profile the retained solver after perf-014, confirm how much original problem-ternary relocation still dominates after the unit-first tail keep on `large/test_6.cnf` and `special/hard.cnf`, and queue one evidence-backed next propagation target before attempting another solver-core experiment.
