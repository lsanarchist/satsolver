  - Perf-010 kept no solver change: even a same-content ternary-first branch reorder inside minimize_learnt() regressed the seven-case exact-CLI gate overall, so future conflict-analysis bookkeeping should move away from reason-size branch-order tweaks.
  - Perf-011 kept no solver change: peeling the first two literals out of prepare_learnt_clause() regressed the seven-case exact-CLI gate overall, so future learnt-finalization work should move away from pure loop-shape cleanup.
  - Perf-012 kept a solver change: computing backtrack/LBD metadata during post-minimization compaction improved the seven-case exact-CLI slice and the repeat-aware 59-case exact-CLI suite while keeping the dense hard-case decision/conflict counters unchanged.
  - Perf-013 kept no solver change: the retained post-perf-012 profile still shows propagate() dominating end-to-end time, with original problem-ternary relocation and unit handling remaining the biggest concentrated surface on the dense UNSAT hotspots.
  - Perf-014 kept a solver change: taking the overwhelmingly common unit path directly in the ternary candidate-false tail improved both the seven-case exact-CLI hotspot slice and the same-day repeat-aware 59-case exact-CLI suite while keeping the dense hard-case decision/conflict counters unchanged.
  - Perf-015 kept no solver change: the retained post-perf-014 profile still shows propagate() dominating end-to-end time, with original problem-ternary relocation still the larger remaining surface than units on the dense UNSAT hotspots.
  - Perf-016 kept no solver change: splitting the dominant ternary relocation branch into explicit `candidate=UNASSIGNED` and `candidate=TRUE` cases preserved the dense hard-case decision/conflict counters but still regressed the seven-case exact-CLI gate, so future relocation work should remove bookkeeping rather than add more candidate-state branching.
  - Perf-017 kept a solver change: direct use of `candidate_literal` on the ternary relocation path improved both the seven-case exact-CLI hotspot slice and the repeat-aware 59-case exact-CLI suite while keeping the dense hard-case decision/conflict counters unchanged.
  - Perf-018 kept no solver change: the retained post-perf-017 profile still shows propagate() dominating end-to-end time, with original problem-ternary relocation still primary and learnt-large relocation still the next secondary watcher-churn bucket on the dense UNSAT hotspots.
  - Perf-019 kept no solver change: directly rewriting successful learnt-large relocation swaps won the focused seven-case and structural guardrails but regressed the repeat-aware 59-case exact-CLI suite, so future learnt-large work needs a broader exact-CLI guard slice before another keep attempt.
  - Perf-020 kept no solver change: the perf-019 broad-suite regression came almost entirely from repeat-aware movement inside the existing focused seven-case slice, with only a small secondary satlib_more tail outside it, so future learnt-large work should keep the seven-case slice as primary and add a compact satlib_more guard slice before the full-suite keep gate.
  - Perf-021 kept no solver change: reordering the learnt-large no-replacement tail to favor the common unit-or-satisfied path preserved dense hard-case search counters but still regressed both the focused seven-case slice and the supplemental satlib_more slice, so future learnt-large work should move away from failure-tail branch-order tweaks and profile the supplemental satlib_more cases directly before the next candidate.
  - Perf-022 kept no solver change: the supplemental satlib_more slice split into two profiler families, with jnh10/jnh1 dominated by problem-large relocation while uuf125-010/uf125-01/uf125-010 carry the real learnt-large traffic; future learnt-large candidates should target the latter and treat the former as problem-large guardrails.
  - Perf-023 kept no solver change: a selective learnt-large success-path rewrite for long or deep probes improved the supplemental satlib_more slice overall, led by uuf125-010, but still regressed the primary seven-case gate, so the next follow-up should narrow further to the truly overlapping long-and-deep subset instead of keeping the broader OR-gated rewrite.
  - Perf-024 kept no solver change: narrowing the rewrite to the overlapping len10+ and step-3+ learnt-large success lane regressed both the primary seven-case gate and the supplemental slice, so the next follow-up should measure the remaining non-overlap buckets before trying another solver-core success-path edit.
